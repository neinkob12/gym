<title>Gym Tycoon Stilprobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: Vollbild-Spielfeld, HUD schwebt oben und unten, Josef-Dialog unten. Einheitlich dunkler Spielgrund, Skin per data-skin. */
:root {
  --bg: #121418;
  --panel: rgba(18, 20, 24, 0.9);
  --panel-line: rgba(255, 255, 255, 0.12);
  --fg: #f3f1ec;
  --muted: #a3a8af;
  --accent: #b6f22e;
  --accent-ink: #1a1d12;
  --gold: #f2c14e;
  --danger: #ff6b6b;
  --font-hud: "Pixelify Sans", "Courier New", monospace;
  --font-text: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-skin="neon"] {
  --bg: #0b0716;
  --panel: rgba(22, 12, 44, 0.9);
  --panel-line: rgba(255, 63, 164, 0.35);
  --fg: #f8ecff;
  --muted: #b9a6dc;
  --accent: #28f0e6;
  --accent-ink: #07131a;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font-family: var(--font-text); }
#app { position: fixed; inset: 0; }
#view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }

.hud-top {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--panel-line);
  font-family: var(--font-hud); font-size: 15px; font-weight: 500;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  backdrop-filter: blur(6px);
}
.chip b { font-weight: 700; }
.chip .money { color: var(--accent); }
.chip .eur { font-family: var(--font-text); font-weight: 700; color: var(--accent); }
.chip .stars { color: var(--gold); letter-spacing: 1px; }
.chip.closed { color: var(--danger); }
.xp { width: 46px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
.xp > i { display: block; height: 100%; width: 0; background: var(--accent); }

.hud-bottom {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
}
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--panel); border: 1px solid var(--panel-line); }
.seg button, .btn {
  font-family: var(--font-hud); font-size: 15px; font-weight: 700;
  border: 0; border-radius: 9px; padding: 9px 12px; cursor: pointer;
  background: transparent; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { background: var(--panel); color: var(--fg); border: 1px solid var(--panel-line); }
.btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btns { display: inline-flex; gap: 6px; }

.dialog {
  position: absolute;
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
  max-width: 520px; margin: 0 auto;
  display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start;
  padding: 12px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--panel-line);
  backdrop-filter: blur(8px);
}
.dialog canvas { width: 64px; height: 104px; image-rendering: pixelated; background: rgba(255,255,255,.05); border-radius: 10px; }
.dialog .who { font-family: var(--font-hud); font-size: 16px; font-weight: 700; color: var(--accent); }
.dialog .who small { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 6px; }
.dialog p { margin: 4px 0 10px; font-size: 15px; line-height: 1.45; min-width: 0; }
.dialog .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dialog .dots { color: var(--muted); font-family: var(--font-hud); font-size: 13px; }
.dialog .next { background: var(--accent); color: var(--accent-ink); border: 0; }

.toast {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 92px);
  max-width: min(420px, calc(100% - 32px));
  padding: 9px 13px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--panel-line);
  font-size: 14px; line-height: 1.4; text-align: center;
  pointer-events: none;
}
.toast .rev-stars { color: var(--gold); font-family: var(--font-hud); margin-right: 6px; }
.toast .rev-who { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
#review { top: calc(env(safe-area-inset-top, 0px) + 140px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <canvas id="view" aria-label="Gym-Ansicht: ziehen zum Verschieben, zwei Finger zum Zoomen, tippen zum Interagieren"></canvas>

  <div class="hud-top" aria-live="polite">
    <span class="chip"><b class="money" id="money">0</b><span class="eur">€</span></span>
    <span class="chip"><span class="stars" id="stars">★★★☆☆</span><span id="ruf">3,0</span></span>
    <span class="chip">Lvl <b id="lvl">1</b><span class="xp"><i id="xpbar"></i></span></span>
    <span class="chip" id="clockchip"><span id="clock">16:00</span></span>
  </div>

  <div class="hud-bottom">
    <div class="seg" role="group" aria-label="Stil">
      <button id="skin-clean" type="button" aria-pressed="true">Modern</button>
      <button id="skin-neon" type="button" aria-pressed="false">Neon 80er</button>
    </div>
    <div class="btns">
      <button class="btn" id="speed" type="button">Tempo 1×</button>
      <button class="btn" id="center" type="button">Zentrieren</button>
    </div>
  </div>

  <div class="dialog" id="dialog" hidden>
    <canvas id="josef-face" width="20" height="32"></canvas>
    <div>
      <div class="who">Josef <small>18, dein erster Mitarbeiter</small></div>
      <p id="dialog-text"></p>
      <div class="row"><span class="dots" id="dialog-dots"></span><button class="btn next" id="dialog-next" type="button">Weiter</button></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="toast" id="review" hidden></div>
</div>

<script>
(() => {
"use strict";

// ---------- Welt ----------
const TILE = 32;
const MAP = [
  "###############",
  "#WWWWWWWW#WWWW#",
  "#........#bbbb#",
  "#........#bbbb#",
  "#.........bbbb#",
  "#........#bbbb#",
  "#........######",
  "#........#WWWW#",
  "#........#kkkk#",
  "#.........kkkk#",
  "#........#kkkk#",
  "#........#kkkk#",
  "#####...#######",
  "#WWW#...W#WWWW#",
  "#uuu#,,,,#ssss#",
  "#uuu.,,,,#ssss#",
  "#uuu#,,,,.ssss#",
  "#uuu#,,,,#ssss#",
  "######,,#######",
  "ooooooooooooooo",
  "rrrrrrrrrrrrrrr",
];
const COLS = MAP[0].length, ROWS = MAP.length, W = COLS * TILE, H = ROWS * TILE;
const at = (x, y) => (x < 0 || y < 0 || x >= COLS || y >= ROWS) ? "#" : MAP[y][x];

const REGIONS = {
  u: { name: "Umkleide", lvl: 2 },
  b: { name: "Protein Bar", lvl: 3 },
  k: { name: "Kursraum", lvl: 5 },
  s: { name: "Wellness", lvl: 8 },
};
for (const k in REGIONS) Object.assign(REGIONS[k], { x0: 99, y0: 99, x1: -1, y1: -1 });
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  const r = REGIONS[MAP[y][x]];
  if (r) { r.x0 = Math.min(r.x0, x); r.y0 = Math.min(r.y0, y); r.x1 = Math.max(r.x1, x); r.y1 = Math.max(r.y1, y); }
}
const OPENINGS = [[9, 4], [9, 9], [4, 15], [9, 16]];

// ---------- Stile ----------
const THEMES = {
  clean: {
    neon: false,
    floor1: "#34373c", floor2: "#303338", floorLine: "#2a2d31", speck: "#41454b",
    lobby1: "#e4e1da", lobby2: "#dad6ce", lobbyLine: "#c9c4ba",
    walk1: "#b3b6ba", walkLine: "#9a9ea3", road: "#45484d", roadLine: "#e9e3c9", curb: "#cfd2d5",
    wallFace: "#f1efea", wallFace2: "#e2dfd9", wallBase: "#3a3d42", wallCap: "#25272b", wallCapTop: "#3b3e43",
    stripe: "#b6f22e", stripe2: "#b6f22e",
    metal: "#26282c", metalHi: "#454950", chrome: "#cdd2d8", chromeDk: "#8d939b",
    pad: "#1d1f22", padHi: "#3a3d42", plate: "#202226", plateHi: "#3b3e43", bumper: "#b6f22e",
    belt: "#141517", screen: "#8ff0ff", glass: "#cfe8f4", glassHi: "rgba(255,255,255,.55)",
    deskTop: "#f5f3ef", deskFace: "#2a2c30", staff: "#b6f22e", staffInk: "#1a1d12",
    wood: "#b98a5a", wood2: "#a77a4c", kurs: "#d6b388", kurs2: "#c9a57a",
    tileW: "#ecebe8", tileW2: "#dcdad6", tileB: "#a8d8ea", tileB2: "#95cbe0",
    platform: "#6b5136", platformEdge: "#202226",
    pot: "#e9e6e0", potDk: "#c9c5bd", mat: "#2b2d31",
    lockShade: "rgba(14,16,20,.62)", lockStripe: "rgba(255,255,255,.05)",
    night: "12,20,44", sign: "#b6f22e", signBg: "#1d1f22",
  },
  neon: {
    neon: true,
    floor1: "#1c1436", floor2: "#191231", floorLine: "#2a1f52", speck: "#2f2459",
    lobby1: "#251a48", lobby2: "#211741", lobbyLine: "#3a2a6e",
    walk1: "#2c2548", walkLine: "#3d3468", road: "#140f26", roadLine: "#28f0e6", curb: "#4a3f7a",
    wallFace: "#160f2e", wallFace2: "#120c26", wallBase: "#0a0716", wallCap: "#08050f", wallCapTop: "#2a1f4d",
    stripe: "#ff3fa4", stripe2: "#28f0e6",
    metal: "#2c2254", metalHi: "#4b3c8a", chrome: "#8be9ff", chromeDk: "#4aa3c7",
    pad: "#ff3fa4", padHi: "#ff8ccc", plate: "#130d2a", plateHi: "#ff3fa4", bumper: "#28f0e6",
    belt: "#0c0819", screen: "#28f0e6", glass: "#3b2f7a", glassHi: "rgba(139,233,255,.5)",
    deskTop: "#2a1f55", deskFace: "#130d26", staff: "#28f0e6", staffInk: "#07131a",
    wood: "#4a3576", wood2: "#3f2d66", kurs: "#3d2f6b", kurs2: "#35295e",
    tileW: "#2a2350", tileW2: "#241e46", tileB: "#1f3d6b", tileB2: "#1a355e",
    platform: "#1a1238", platformEdge: "#28f0e6",
    pot: "#ff3fa4", potDk: "#c02a7c", mat: "#0f0a1f",
    lockShade: "rgba(6,2,16,.66)", lockStripe: "rgba(255,63,164,.07)",
    night: "18,4,40", sign: "#ff3fa4", signBg: "#0b0716",
  },
};
let skin = "clean";
try { const s = localStorage.getItem("gt-skin"); if (s && THEMES[s]) skin = s; } catch (e) {}
let T = THEMES[skin];

// ---------- Zeichen-Helfer ----------
const world = document.createElement("canvas"); world.width = W; world.height = H;
let g = world.getContext("2d");
const stat = document.createElement("canvas"); stat.width = W; stat.height = H;
const sg = stat.getContext("2d");
function R(c, x, y, w, h, k = g) { k.fillStyle = c; k.fillRect(Math.round(x), Math.round(y), w, h); }
function glow(c, x, y, w, h, k = g, blur = 6) { k.save(); k.shadowColor = c; k.shadowBlur = blur; R(c, x, y, w, h, k); k.restore(); }
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const FONT = {
  G: ["111", "100", "101", "101", "111"], Y: ["101", "101", "010", "010", "010"],
  M: ["101", "111", "101", "101", "101"], O: ["111", "101", "101", "101", "111"],
  P: ["111", "101", "111", "100", "100"], E: ["111", "100", "110", "100", "111"],
  N: ["110", "101", "101", "101", "101"], "6": ["111", "100", "111", "101", "111"],
  "2": ["111", "001", "111", "100", "111"], "3": ["111", "001", "111", "001", "111"],
  "-": ["000", "000", "111", "000", "000"], "4": ["101", "101", "111", "001", "001"],
  "7": ["111", "001", "010", "010", "010"], "/": ["001", "001", "010", "100", "100"], " ": ["000", "000", "000", "000", "000"],
};
function pixText(k, str, x, y, s, c, withGlow) {
  let cx = x;
  for (const ch of str) {
    const f = FONT[ch] || FONT[" "];
    for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) if (f[r][q] === "1") {
      if (withGlow) glow(c, cx + q * s, y + r * s, s, s, k, 5); else R(c, cx + q * s, y + r * s, s, s, k);
    }
    cx += 4 * s;
  }
}

// ---------- Statische Ebene ----------
function floorHall(k, X, Y, x, y) {
  R((x + y) & 1 ? T.floor1 : T.floor2, X, Y, 32, 32, k);
  R(T.floorLine, X, Y, 32, 1, k); R(T.floorLine, X, Y, 1, 32, k);
  for (let i = 0; i < 6; i++) R(T.speck, X + 2 + hash(x, y, i) * 28, Y + 2 + hash(x, y, i + 9) * 28, 1, 1, k);
  grime(k, X, Y, x, y);
}
function grime(k, X, Y, x, y) {
  // geerbter Ranz: Flecken und Risse
  if (hash(x, y, 40) < 0.22) {
    const sx = X + 4 + hash(x, y, 41) * 16, sy = Y + 4 + hash(x, y, 42) * 16;
    R("rgba(60,45,20,.35)", sx, sy, 9, 6, k); R("rgba(60,45,20,.35)", sx + 2, sy - 2, 5, 10, k);
  }
  if (hash(x, y, 43) < 0.16) {
    let cx = X + 6 + hash(x, y, 44) * 18, cy = Y + 4;
    for (let i = 0; i < 9; i++) { R("rgba(0,0,0,.35)", cx, cy + i * 2, 1, 2, k); cx += hash(x, y, 50 + i) < 0.5 ? -1 : 1; }
  }
}
function floorLobby(k, X, Y, x, y) {
  R((x + y) & 1 ? T.lobby1 : T.lobby2, X, Y, 32, 32, k);
  R(T.lobbyLine, X, Y, 32, 1, k); R(T.lobbyLine, X, Y, 1, 32, k);
  R(T.lobbyLine, X, Y + 16, 32, 1, k); R(T.lobbyLine, X + 16, Y, 1, 32, k);
  grime(k, X, Y, x, y);
}
function floorWalk(k, X, Y) {
  R(T.walk1, X, Y, 32, 32, k); R(T.walkLine, X, Y + 31, 32, 1, k); R(T.walkLine, X + 31, Y, 1, 32, k);
}
function floorRoad(k, X, Y, x) {
  R(T.road, X, Y, 32, 32, k); R(T.curb, X, Y, 32, 3, k);
  if (x % 2 === 0) { if (T.neon) glow(T.roadLine, X + 6, Y + 17, 20, 2, k, 4); else R(T.roadLine, X + 6, Y + 17, 20, 2, k); }
}
function floorWood(k, X, Y, x, y, a, b) {
  for (let i = 0; i < 4; i++) {
    R(i % 2 ? a : b, X, Y + i * 8, 32, 8, k);
    R("rgba(0,0,0,.15)", X + ((x * 7 + y * 3 + i * 11) % 32), Y + i * 8, 1, 8, k);
  }
}
function floorTiles(k, X, Y, x, y, a, b) {
  R(a, X, Y, 32, 32, k);
  R(b, X, Y + 15, 32, 2, k); R(b, X + 15, Y, 2, 32, k); R(b, X, Y, 32, 1, k); R(b, X, Y, 1, 32, k);
}
function wallFace(k, X, Y) {
  R(T.wallFace, X, Y, 32, 32, k);
  R(T.wallFace2, X, Y + 22, 32, 7, k);
  R(T.wallBase, X, Y + 29, 32, 3, k);
  if (T.neon) { glow(T.stripe, X, Y + 9, 32, 2, k); glow(T.stripe2, X, Y + 21, 32, 1, k); }
  else R(T.stripe, X, Y + 20, 32, 2, k);
  const x = X / 32, y = Y / 32;
  if (hash(x, y, 60) < 0.45) R("rgba(90,70,40,.22)", X + 4 + hash(x, y, 61) * 18, Y + 2 + hash(x, y, 62) * 10, 7, 9, k);
  if (hash(x, y, 63) < 0.3) R(T.wallFace2, X + hash(x, y, 64) * 24, Y + 24, 6, 5, k);
}
function buildStatic() {
  const k = sg;
  k.clearRect(0, 0, W, H);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = MAP[y][x], X = x * TILE, Y = y * TILE;
    if (c === "#") { R(T.wallCap, X, Y, 32, 32, k); R(T.wallCapTop, X, Y, 32, 2, k); }
    else if (c === "W") wallFace(k, X, Y);
    else if (c === ".") floorHall(k, X, Y, x, y);
    else if (c === ",") floorLobby(k, X, Y, x, y);
    else if (c === "o") floorWalk(k, X, Y);
    else if (c === "r") floorRoad(k, X, Y, x);
    else if (c === "b") floorWood(k, X, Y, x, y, T.wood, T.wood2);
    else if (c === "k") floorWood(k, X, Y, x, y, T.kurs, T.kurs2);
    else if (c === "u") floorTiles(k, X, Y, x, y, T.tileW, T.tileW2);
    else if (c === "s") floorTiles(k, X, Y, x, y, T.tileB, T.tileB2);
  }
  // Schatten unter Wänden
  for (let y = 1; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = MAP[y][x];
    if ("#W".includes(c)) continue;
    if ("#W".includes(at(x, y - 1))) R("rgba(0,0,0,.24)", x * 32, y * 32, 32, 4, k);
    if (at(x - 1, y) === "#") R("rgba(0,0,0,.14)", x * 32, y * 32, 3, 32, k);
  }
  // Hebeplattform unter dem Rack
  R(T.platformEdge, 6 * 32 + 1, 2 * 32 + 26, 62, 38, k);
  R(T.platform, 6 * 32 + 3, 2 * 32 + 28, 58, 34, k);
  if (!T.neon) for (let i = 0; i < 4; i++) R("rgba(0,0,0,.12)", 6 * 32 + 3, 2 * 32 + 30 + i * 8, 58, 1, k);
  // Spiegel an der Hallenwand
  R(T.metal, 3 * 32 + 2, 32 + 2, 92, 22, k);
  R(T.glass, 3 * 32 + 4, 32 + 4, 88, 18, k);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 16; j++) R(T.glassHi, 3 * 32 + 14 + i * 28 + (16 - j) / 2, 32 + 5 + j, 2, 1, k);
  // Protein Bar: Regal mit Dosen (Vorschau)
  for (let s = 0; s < 2; s++) {
    R(T.metal, 10 * 32 + 4, 32 + 12 + s * 10, 120, 2, k);
    for (let i = 0; i < 11; i++) R(["#e5484d", "#3ea0ff", "#f2c14e", "#b6f22e", "#ff8ccc"][(i + s * 2) % 5], 10 * 32 + 6 + i * 11, 32 + 5 + s * 10, 7, 7, k);
  }
  // Kursraum: Spiegelwand
  R(T.glass, 10 * 32 + 3, 7 * 32 + 4, 122, 18, k);
  // Wellness: Holzwand
  for (let i = 0; i < 8; i++) R(i % 2 ? "#8a5a3b" : "#7a4f33", 10 * 32 + i * 16, 13 * 32, 16, 29, k);
  // Eingang: Matte und Türrahmen
  R(T.mat, 6 * 32 + 3, 18 * 32 + 5, 58, 22, k);
  R(T.metal, 6 * 32, 18 * 32, 3, 32, k); R(T.metal, 8 * 32 - 3, 18 * 32, 3, 32, k);
  // Schilder über der Fassade
  R(T.signBg, 1 * 32 + 6, 18 * 32 + 6, 80, 20, k);
  pixText(k, "GYM", 1 * 32 + 20, 18 * 32 + 8, 3, T.sign, T.neon);
  R(T.signBg, 9 * 32 + 6, 18 * 32 + 8, 112, 16, k);
  pixText(k, "OPEN 24/7", 9 * 32 + 10, 18 * 32 + 11, 2, T.neon ? T.stripe2 : T.sign, T.neon);
  // Gesperrte Bereiche abdunkeln
  for (const key in REGIONS) {
    const r = REGIONS[key];
    const fy = at(r.x0, r.y0 - 1) === "W" ? r.y0 - 1 : r.y0;
    const X = r.x0 * 32, Y = fy * 32, w = (r.x1 - r.x0 + 1) * 32, h = (r.y1 - fy + 1) * 32;
    R(T.lockShade, X, Y, w, h, k);
    k.save(); k.beginPath(); k.rect(X, Y, w, h); k.clip();
    for (let d = -h; d < w; d += 10) for (let j = 0; j < h; j++) R(T.lockStripe, X + d + j, Y + j, 3, 1, k);
    k.restore();

  // Beschriftungen der gesperrten Bereiche
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const k in REGIONS) {
    const r = REGIONS[k];
    const [sx, sy] = toScreen((r.x0 + r.x1 + 1) * 16, (r.y0 + r.y1 + 1) * 16 + 14);
    if (sx < -80 || sx > cw + 80 || sy < -40 || sy > ch + 40) continue;
    const fs = Math.max(10, Math.min(15, 6 * cam.s));
    ctx.font = `700 ${fs}px "Pixelify Sans", monospace`;
    ctx.fillStyle = colFg; ctx.fillText(r.name, sx, sy);
    ctx.font = `500 ${fs - 2}px "Pixelify Sans", monospace`;
    ctx.fillStyle = colMuted; ctx.fillText("ab Level " + r.lvl, sx, sy + fs + 2);
  }
  // schwebende Zahlen
  for (const p of popups) {
    const [sx, sy] = toScreen(p.x, p.y - (1.4 - p.t) * 18);
    ctx.globalAlpha = Math.min(1, p.t * 2);
    ctx.font = `700 ${Math.max(13, 7 * cam.s)}px "Atkinson Hyperlegible", system-ui, sans-serif`;
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.strokeText(p.text, sx, sy);
    ctx.fillStyle = p.color === "money" ? colAccent : "#ffffff"; ctx.fillText(p.text, sx, sy);
    ctx.globalAlpha = 1;
  }
  // Sprechblasen mit Text
  const s = says[says.length - 1];
  if (s) {
    const [sx, sy0] = toScreen(s.who.x, s.who.y - 34);
    ctx.font = `400 13px "Atkinson Hyperlegible", system-ui, sans-serif`;
    const maxW = Math.min(220, cw - 32);
    const words = s.text.split(" "); const lines = []; let line = "";
    for (const w of words) { const test = line ? line + " " + w : w; if (ctx.measureText(test).width > maxW - 20 && line) { lines.push(line); line = w; } else line = test; }
    lines.push(line);
    const bw = Math.min(maxW, Math.max(...lines.map((l) => ctx.measureText(l).width)) + 20), bh = lines.length * 17 + 12;
    const bx = Math.max(16, Math.min(cw - 16 - bw, sx - bw / 2)), by = sy0 - bh - 8;
    ctx.globalAlpha = Math.min(1, s.t * 3);
    ctx.fillStyle = "#ffffff"; roundRect(bx, by, bw, bh, 9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 6, by + bh); ctx.lineTo(sx + 6, by + bh); ctx.lineTo(sx, by + bh + 7); ctx.fill();
    ctx.fillStyle = "#16181c"; ctx.textAlign = "left";
    lines.forEach((l, i) => ctx.fillText(l, bx + 10, by + 14 + i * 17));
    ctx.textAlign = "center"; ctx.globalAlpha = 1;
  }
}

// ---------- HUD ----------
const $ = (id) => document.getElementById(id);
let last = {};
function hud() {
  const money = Math.floor(state.money).toLocaleString("de-DE");
  if (last.money !== money) { $("money").textContent = money; last.money = money; }
  const r = Math.round(state.ruf * 10) / 10;
  if (last.ruf !== r) {
    const full = Math.round(state.ruf);
    $("stars").textContent = "★".repeat(full) + "☆".repeat(5 - full);
    $("ruf").textContent = r.toLocaleString("de-DE", { minimumFractionDigits: 1 });
    last.ruf = r;
  }
  if (last.lvl !== state.lvl) { $("lvl").textContent = state.lvl; last.lvl = state.lvl; }
  const lo = LVL[state.lvl - 1], hi = LVL[state.lvl] || lo + 1;
  $("xpbar").style.width = Math.min(100, ((state.xp - lo) / (hi - lo)) * 100) + "%";
  const hh = Math.floor(state.min / 60), mm = Math.floor(state.min % 60);
  const clock = String(hh).padStart(2, "0") + ":" + String(Math.floor(mm / 10) * 10).padStart(2, "0") + " · 24/7";
  if (last.clock !== clock) { $("clock").textContent = clock; last.clock = clock; }
}
let toastT = 0;
function toast(text) { const el = $("toast"); el.textContent = text; el.hidden = false; toastT = 2.6; }

// ---------- Eingabe ----------
const pointers = new Map();
let gesture = null;
view.addEventListener("pointerdown", (e) => {
  view.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) gesture = { type: "pan", sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, t: performance.now(), moved: false };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    gesture = { type: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y };
  }
});
view.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture) return;
  const rect = view.getBoundingClientRect();
  if (gesture.type === "pan" && pointers.size === 1) {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (Math.hypot(dx, dy) > 6) gesture.moved = true;
    cam.x = gesture.cx + dx; cam.y = gesture.cy + dy; clampCam();
  } else if (gesture.type === "pinch" && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = Math.max(minScale(), Math.min(4, gesture.s * d / gesture.d));
    const mx = gesture.mx - rect.left, my = gesture.my - rect.top;
    const wx = (mx - gesture.cx) / gesture.s, wy = (my - gesture.cy) / gesture.s;
    const nmx = (a.x + b.x) / 2 - rect.left, nmy = (a.y + b.y) / 2 - rect.top;
    cam.s = ns; cam.x = nmx - wx * ns; cam.y = nmy - wy * ns; clampCam();
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture && gesture.type === "pan" && !gesture.moved && performance.now() - gesture.t < 400 && pointers.size === 0) {
    const rect = view.getBoundingClientRect();
    tap(...toWorld(e.clientX - rect.left, e.clientY - rect.top));
  }
  if (pointers.size === 0) gesture = null;
  else if (pointers.size === 1) { const [p] = [...pointers.values()]; gesture = { type: "pan", sx: p.x, sy: p.y, cx: cam.x, cy: cam.y, t: 0, moved: true }; }
}
view.addEventListener("pointerup", endPointer);
view.addEventListener("pointercancel", endPointer);
view.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = view.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [wx, wy] = toWorld(mx, my);
  cam.s = Math.max(minScale(), Math.min(4, cam.s * Math.exp(-e.deltaY * 0.0015)));
  cam.x = mx - wx * cam.s; cam.y = my - wy * cam.s; clampCam();
}, { passive: false });

function tap(wx, wy) {
  const tx = Math.floor(wx / 32), ty = Math.floor(wy / 32);
  // Müll
  const li = litter.findIndex((l) => Math.abs(l.tx * 32 + l.ox + 6 - wx) < 14 && Math.abs(l.ty * 32 + l.oy + 3 - wy) < 14);
  if (li >= 0) {
    const l = litter.splice(li, 1)[0];
    popup(l.tx * 32 + 16, l.ty * 32 + 10, "Aufgeräumt", "ok"); state.ruf = Math.min(5, state.ruf + 0.03); return;
  }
  // Personen
  const near = [...people, josef].find((p) => Math.abs(p.x - wx) < 10 && wy < p.y + 2 && wy > p.y - 30);
  if (near === josef) { toast("Josef, 18. Sein Vater trainiert hier seit Jahren. Zuverlässig wie ein Uhrwerk."); return; }
  if (near) {
    const ty2 = TYPES[near.type];
    toast(ty2.label + (near.type === "wellness" ? ": will in die Sauna" : ": will " + [...new Set(ty2.wants.map((k) => EQ.find((e) => e.kind === k).name))].join(", ")));
    return;
  }
  // Geräte
  const e = EQ.find((q) => q.tiles.some(([x, y]) => x === tx && (y === ty || y === ty + 1)));
  if (e) {
    if (e.kind === "water") { toast("Wasserspender: kostenlos, macht Kunden glücklich."); return; }
    if ((e.broken || e.wear < 30) && !e.queued) {
      if (e.user) { toast(e.name + " ist gerade belegt. Josef repariert danach."); }
      e.queued = true; jobs.push(e); say(josef, "Bin unterwegs!", 1.6); return;
    }
    toast(e.name + ": Zustand " + Math.round(e.wear) + " %" + (e.queued ? ", Josef ist dran" : ""));
    return;
  }
  // Gesperrte Bereiche
  for (const k in REGIONS) {
    const r = REGIONS[k];
    if (tx >= r.x0 && tx <= r.x1 && ty >= r.y0 - 1 && ty <= r.y1) { toast(r.name + ": ab Level " + r.lvl + " freischaltbar."); return; }
  }
}

// ---------- Steuerung ----------
function applySkin(name) {
  skin = name; T = THEMES[name];
  document.documentElement.dataset.skin = name;
  $("skin-clean").setAttribute("aria-pressed", String(name === "clean"));
  $("skin-neon").setAttribute("aria-pressed", String(name === "neon"));
  josef.look.shirt = T.staff;
  try { localStorage.setItem("gt-skin", name); } catch (e) {}
  readColors(); buildStatic(); drawFace();
}
$("skin-clean").addEventListener("click", () => applySkin("clean"));
$("skin-neon").addEventListener("click", () => applySkin("neon"));
$("speed").addEventListener("click", () => {
  state.speed = state.speed === 1 ? 3 : 1;
  $("speed").textContent = "Tempo " + state.speed + "×";
});
$("center").addEventListener("click", centerCam);

// Josef-Dialog
const LINES = [
  "Hey, ich bin Josef! Dein Onkel hat dir die alte Muckibude vermacht. Ja, die sieht genau so aus, wie sie riecht.",
  "Hier hat früher sogar eine echte Bodybuilding-Legende trainiert. Mein Vater auch, seit ich denken kann. Ich kenne jede Hantel beim Vornamen.",
  "Die Geräte sind uralt, ein Laufband ist schon tot. Tipp auf kaputte oder wackelige Geräte, dann repariere ich sie. Liegt was rum, tipp drauf.",
  "Die Leute meckern noch viel. Wenn wir aufräumen und reparieren, steigt der Ruf, und die dunklen Bereiche schalten wir nach und nach frei.",
];
let line = 0;
function drawFace() {
  const c = $("josef-face"), k = c.getContext("2d");
  k.clearRect(0, 0, c.width, c.height);
  const tmp = { ...josef, x: 10, y: 30, dir: "down", moving: false, pose: "stand", bub: null };
  const keep = g; g = k;
  try { drawPerson(tmp, 0); } finally { g = keep; }
}
function showLine() {
  $("dialog-text").textContent = LINES[line];
  $("dialog-dots").textContent = (line + 1) + " / " + LINES.length;
  $("dialog-next").textContent = line === LINES.length - 1 ? "Los geht's" : "Weiter";
}
$("dialog-next").addEventListener("click", () => {
  line++;
  if (line >= LINES.length) { $("dialog").hidden = true; try { localStorage.setItem("gt-intro2", "1"); } catch (e) {} return; }
  showLine();
});

// ---------- Start ----------
let seen = false;
try { seen = localStorage.getItem("gt-intro2") === "1"; } catch (e) {}
if (!seen) { $("dialog").hidden = false; showLine(); }
litter.push(
  { tx: 3, ty: 4, kind: "db", ox: 8, oy: 14 }, { tx: 4, ty: 9, kind: "towel", ox: 10, oy: 16 },
  { tx: 2, ty: 7, kind: "bottle", ox: 12, oy: 12 }, { tx: 6, ty: 13, kind: "towel", ox: 9, oy: 15 },
  { tx: 3, ty: 11, kind: "db", ox: 14, oy: 10 }, { tx: 6, ty: 16, kind: "bottle", ox: 7, oy: 18 },
);
for (let i = 0; i < 5; i++) {
  spawn();
  const p = people[people.length - 1];
  const tiles = [[3, 6], [4, 8], [2, 4], [6, 5], [7, 10]];
  p.x = tiles[i][0] * 32 + 16; p.y = tiles[i][1] * 32 + 24; p.path = []; p.state = "checkin"; p.timer = 0.01 + i * 0.3;
  if (p.type === "wellness") p.type = "anfaenger";
}

resize(); centerCam(); applySkin(skin);
window.addEventListener("resize", () => { resize(); });
document.fonts && document.fonts.ready.then(readColors);

let prevT = performance.now(), simT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now;
  const sdt = dt * state.speed; simT += sdt;
  step(sdt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $("toast").hidden = true; }
  if (reviewT > 0) { reviewT -= dt; if (reviewT <= 0) $("review").hidden = true; }
  drawWorld(simT); render(simT); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
