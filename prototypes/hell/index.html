<title>Gym Tycoon Hell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: Vollbild-Spielfeld, helle HUD-Karten oben und unten, Josef-Dialog unten. Ein heller Look, zwei Kamera-Ansichten. */
:root {
  --bg: #dcefe4;
  --panel: rgba(255, 255, 255, 0.94);
  --panel-line: rgba(38, 48, 58, 0.12);
  --fg: #26303a;
  --muted: #66717d;
  --accent: #ff7a59;
  --accent-ink: #ffffff;
  --teal: #2bb5a4;
  --gold: #e9a91c;
  --font-hud: "Pixelify Sans", "Courier New", monospace;
  --font-text: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font-family: var(--font-text); }
#app { position: fixed; inset: 0; }
#view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }

.hud-top {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--panel-line);
  box-shadow: 0 2px 0 rgba(38, 48, 58, 0.08);
  font-family: var(--font-hud); font-size: 15px; font-weight: 500;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip b { font-weight: 700; }
.chip .money, .chip .eur { color: var(--teal); }
.chip .eur { font-family: var(--font-text); font-weight: 700; }
.chip .stars { color: var(--gold); letter-spacing: 1px; }
.xp { width: 46px; height: 6px; border-radius: 3px; background: rgba(38, 48, 58, 0.12); overflow: hidden; }
.xp > i { display: block; height: 100%; width: 0; background: var(--accent); }

.hud-bottom {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
}
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--panel); border: 1px solid var(--panel-line); box-shadow: 0 2px 0 rgba(38, 48, 58, 0.08); }
.seg button, .btn {
  font-family: var(--font-hud); font-size: 15px; font-weight: 700;
  border: 0; border-radius: 9px; padding: 9px 12px; cursor: pointer;
  background: transparent; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { background: var(--panel); color: var(--fg); border: 1px solid var(--panel-line); box-shadow: 0 2px 0 rgba(38, 48, 58, 0.08); }
.btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btns { display: inline-flex; gap: 6px; }

.dialog {
  position: absolute;
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
  max-width: 520px; margin: 0 auto;
  display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start;
  padding: 12px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--panel-line);
  box-shadow: 0 4px 0 rgba(38, 48, 58, 0.1);
}
.dialog canvas { width: 64px; height: 104px; image-rendering: pixelated; background: #f1ece2; border-radius: 10px; }
.dialog .who { font-family: var(--font-hud); font-size: 16px; font-weight: 700; color: var(--accent); }
.dialog .who small { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 6px; }
.dialog p { margin: 4px 0 10px; font-size: 15px; line-height: 1.45; min-width: 0; }
.dialog .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dialog .dots { color: var(--muted); font-family: var(--font-hud); font-size: 13px; }
.dialog .next { background: var(--accent); color: var(--accent-ink); border: 0; }

.toast {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 92px);
  max-width: min(420px, calc(100% - 32px));
  padding: 9px 13px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--panel-line);
  box-shadow: 0 3px 0 rgba(38, 48, 58, 0.1);
  font-size: 14px; line-height: 1.4; text-align: center; pointer-events: none;
}
.toast .rev-stars { color: var(--gold); font-family: var(--font-hud); margin-right: 6px; }
.toast .rev-who { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
#review { top: calc(env(safe-area-inset-top, 0px) + 140px); }
</style>

<div id="app">
  <canvas id="view" aria-label="Gym-Ansicht: ziehen zum Verschieben, zwei Finger zum Zoomen, tippen zum Interagieren"></canvas>

  <div class="hud-top" aria-live="polite">
    <span class="chip"><b class="money" id="money">0</b><span class="eur">€</span></span>
    <span class="chip"><span class="stars" id="stars">★★☆☆☆</span><span id="ruf">2,1</span></span>
    <span class="chip">Lvl <b id="lvl">1</b><span class="xp"><i id="xpbar"></i></span></span>
    <span class="chip"><span id="clock">16:00</span></span>
  </div>

  <div class="hud-bottom">
    <div class="seg" role="group" aria-label="Kamera">
      <button id="mode-td" type="button" aria-pressed="true">Schräg</button>
      <button id="mode-iso" type="button" aria-pressed="false">Isometrisch</button>
    </div>
    <div class="btns">
      <button class="btn" id="speed" type="button">Tempo 1×</button>
      <button class="btn" id="center" type="button">Zentrieren</button>
    </div>
  </div>

  <div class="dialog" id="dialog" hidden>
    <canvas id="josef-face" width="20" height="32"></canvas>
    <div>
      <div class="who">Josef <small>18, dein erster Mitarbeiter</small></div>
      <p id="dialog-text"></p>
      <div class="row"><span class="dots" id="dialog-dots"></span><button class="btn next" id="dialog-next" type="button">Weiter</button></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="toast" id="review" hidden></div>
</div>

<script>
(() => {
"use strict";

// ---------- Karte ----------
const TILE = 32;
const MAP = [
  "###############",
  "#WWWWWWWW#WWWW#",
  "#........#bbbb#",
  "#........#bbbb#",
  "#.........bbbb#",
  "#........#bbbb#",
  "#........######",
  "#........#WWWW#",
  "#........#kkkk#",
  "#.........kkkk#",
  "#........#kkkk#",
  "#........#kkkk#",
  "#####...#######",
  "#WWW#...W#WWWW#",
  "#uuu#,,,,#ssss#",
  "#uuu.,,,,#ssss#",
  "#uuu#,,,,.ssss#",
  "#uuu#,,,,#ssss#",
  "######,,#######",
  "ooooooooooooooo",
  "rrrrrrrrrrrrrrr",
];
const COLS = MAP[0].length, ROWS = MAP.length;
const at = (x, y) => (x < 0 || y < 0 || x >= COLS || y >= ROWS) ? "#" : MAP[y][x];
const isWall = (c) => c === "#" || c === "W";

const REGIONS = {
  u: { name: "Umkleide", lvl: 2 },
  b: { name: "Protein Bar", lvl: 3 },
  k: { name: "Kursraum", lvl: 5 },
  s: { name: "Wellness", lvl: 8 },
};
for (const k in REGIONS) Object.assign(REGIONS[k], { x0: 99, y0: 99, x1: -1, y1: -1 });
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  const r = REGIONS[MAP[y][x]];
  if (r) { r.x0 = Math.min(r.x0, x); r.y0 = Math.min(r.y0, y); r.x1 = Math.max(r.x1, x); r.y1 = Math.max(r.y1, y); }
}
const OPENINGS = [[9, 4], [9, 9], [4, 15], [9, 16]];

// ---------- Heller Look ----------
const T = {
  floor1: "#d3dbe3", floor2: "#ccd5de", floorLine: "#bcc7d1", speck: "#b3bfca",
  lobby1: "#f7eedc", lobby2: "#f1e5cf", lobbyLine: "#e3d4b8",
  walk1: "#ebe7df", walkLine: "#d6d0c5", grass: "#a8da82", grass2: "#92cd6b", curb: "#dcd6cb",
  wallFace: "#fffdf8", wallFace2: "#f1ebe0", wallSide: "#e6ddce", wallBase: "#d9cfbf", wallCap: "#d8ccb7", wallCapTop: "#ece4d6",
  stripe: "#ff7a59", stripe2: "#2bb5a4",
  metal: "#58626e", metalHi: "#808b97", chrome: "#e6ebf0", chromeDk: "#a9b2bc",
  pad: "#ff7a59", padHi: "#ffa68e", plate: "#3d4552", plateHi: "#5f6977", bumper: "#2bb5a4",
  belt: "#3d4552", screen: "#7ee0ff", glass: "#d6f0fa", glassHi: "#ffffff",
  deskTop: "#ffffff", deskFace: "#2bb5a4", staff: "#ff7a59", staffInk: "#ffffff",
  wood: "#ecc995", wood2: "#e2bb82", kurs: "#f3dbb4", kurs2: "#ebcf9f",
  tileW: "#ffffff", tileW2: "#e4e9ed", tileB: "#c3eaf3", tileB2: "#a9dfeb",
  platform: "#dcb98d", platformEdge: "#58626e",
  pot: "#ffffff", potDk: "#dfe4e8", mat: "#58626e",
  lockShade: "rgba(84,96,112,.38)", lockStripe: "rgba(255,255,255,.16)",
  night: "44,64,120", sign: "#ff7a59", signBg: "#ffffff", outline: "#2b323c",
  stain: "rgba(140,110,60,.22)", crack: "rgba(70,70,80,.32)",
};

// ---------- Zeichen-Helfer ----------
let g = null;
function R(c, x, y, w, h, k = g) { k.fillStyle = c; k.fillRect(Math.round(x), Math.round(y), w, h); }
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
  return "#" + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => c(v).toString(16).padStart(2, "0")).join("");
}
function fillPoly(k, pts, c) {
  k.fillStyle = c;
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.floor(y0); y < Math.ceil(y1); y++) {
    const yc = y + 0.5; let a = Infinity, b = -Infinity;
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) { const x = ax + ((yc - ay) / (by - ay)) * (bx - ax); a = Math.min(a, x); b = Math.max(b, x); }
    }
    if (a < b) { const l = Math.round(a), r = Math.round(b); if (r > l) k.fillRect(l, y, r - l, 1); }
  }
}
function line(k, x0, y0, x1, y1, c) {
  k.fillStyle = c; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) { k.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}

const FONT = {
  G: ["111", "100", "101", "101", "111"], Y: ["101", "101", "010", "010", "010"],
  M: ["101", "111", "101", "101", "101"], O: ["111", "101", "101", "101", "111"],
  P: ["111", "101", "111", "100", "100"], E: ["111", "100", "110", "100", "111"],
  N: ["110", "101", "101", "101", "101"], "2": ["111", "001", "111", "100", "111"],
  "4": ["101", "101", "111", "001", "001"], "7": ["111", "001", "010", "010", "010"],
  "/": ["001", "001", "010", "100", "100"], " ": ["000", "000", "000", "000", "000"],
};
function pixText(k, str, x, y, s, c) {
  let cx = x;
  for (const ch of str) {
    const f = FONT[ch] || FONT[" "];
    for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) if (f[r][q] === "1") R(c, cx + q * s, y + r * s, s, s, k);
    cx += 4 * s;
  }
}

// ---------- Ansichten ----------
let mode = "td";
try { const s = localStorage.getItem("gt-view"); if (s === "iso" || s === "td") mode = s; } catch (e) {}
const TD = { w: COLS * TILE, h: ROWS * TILE };
const ISO = { ox: ROWS * 16 + 24, oy: 70, w: (COLS + ROWS) * 16 + 48, h: (COLS + ROWS) * 8 + 70 + 30 };
const isoP = (fx, fy) => [ISO.ox + (fx - fy) * 16, ISO.oy + (fx + fy) * 8];
const proj = (x, y) => mode === "td" ? [x, y] : isoP(x / 32, (y - 8) / 32);
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
const worldTD = makeCanvas(TD.w, TD.h), statTD = makeCanvas(TD.w, TD.h);
const worldISO = makeCanvas(ISO.w, ISO.h), statISO = makeCanvas(ISO.w, ISO.h);
const cur = () => mode === "td" ? { world: worldTD, stat: statTD, w: TD.w, h: TD.h } : { world: worldISO, stat: statISO, w: ISO.w, h: ISO.h };

// Isometrische Quader: Deckel, linke Seite (zeigt nach +y), rechte Seite (zeigt nach +x)
function box(k, fx, fy, w, d, h, z, color, top) {
  const N = isoP(fx, fy), E = isoP(fx + w, fy), S = isoP(fx + w, fy + d), Wp = isoP(fx, fy + d);
  const up = (p, dz) => [p[0], p[1] - dz];
  if (h > 0) {
    fillPoly(k, [up(Wp, z), up(S, z), up(S, z + h), up(Wp, z + h)], shade(color, 0.86));
    fillPoly(k, [up(S, z), up(E, z), up(E, z + h), up(S, z + h)], shade(color, 0.72));
  }
  fillPoly(k, [up(N, z + h), up(E, z + h), up(S, z + h), up(Wp, z + h)], top || color);
}
function diamond(k, tx, ty, c, lineC) {
  const N = isoP(tx, ty), E = isoP(tx + 1, ty), S = isoP(tx + 1, ty + 1), Wp = isoP(tx, ty + 1);
  if (lineC) {
    fillPoly(k, [N, E, S, Wp], lineC);
    fillPoly(k, [[N[0], N[1] + 1], [E[0] - 2, E[1]], [S[0], S[1] - 1], [Wp[0] + 2, Wp[1]]], c);
  } else fillPoly(k, [N, E, S, Wp], c);
}
// Rechteck auf der Wandfläche y = Y (schaut in den Raum)
function wallRectY(k, Y, a, b, z0, z1, c) {
  const A = isoP(a, Y), B = isoP(b, Y);
  fillPoly(k, [[A[0], A[1] - z0], [B[0], B[1] - z0], [B[0], B[1] - z1], [A[0], A[1] - z1]], c);
}
function wallRectX(k, X, a, b, z0, z1, c) {
  const A = isoP(X, a), B = isoP(X, b);
  fillPoly(k, [[A[0], A[1] - z0], [B[0], B[1] - z0], [B[0], B[1] - z1], [A[0], A[1] - z1]], c);
}

// ---------- Böden (beide Ansichten) ----------
function floorColors(c, x, y) {
  if (c === ".") return [(x + y) & 1 ? T.floor1 : T.floor2, T.floorLine];
  if (c === ",") return [(x + y) & 1 ? T.lobby1 : T.lobby2, T.lobbyLine];
  if (c === "o") return [T.walk1, T.walkLine];
  if (c === "r") return [(x + y) & 1 ? T.grass : T.grass2, null];
  if (c === "b") return [(x + y) & 1 ? T.wood : T.wood2, null];
  if (c === "k") return [(x + y) & 1 ? T.kurs : T.kurs2, null];
  if (c === "u") return [T.tileW, T.tileW2];
  if (c === "s") return [T.tileB, T.tileB2];
  return null;
}

// ---------- Statische Ebene: Schräg ----------
function grimeTD(k, X, Y, x, y) {
  if (hash(x, y, 40) < 0.22) {
    const sx = X + 4 + hash(x, y, 41) * 16, sy = Y + 4 + hash(x, y, 42) * 16;
    R(T.stain, sx, sy, 9, 6, k); R(T.stain, sx + 2, sy - 2, 5, 10, k);
  }
  if (hash(x, y, 43) < 0.16) {
    let cx = X + 6 + hash(x, y, 44) * 18;
    for (let i = 0; i < 9; i++) { R(T.crack, cx, Y + 4 + i * 2, 1, 2, k); cx += hash(x, y, 50 + i) < 0.5 ? -1 : 1; }
  }
}
function buildStaticTD() {
  const k = statTD.getContext("2d");
  k.clearRect(0, 0, TD.w, TD.h);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = MAP[y][x], X = x * TILE, Y = y * TILE;
    if (c === "#") { R(T.wallCap, X, Y, 32, 32, k); R(T.wallCapTop, X, Y, 32, 3, k); R(shade(T.wallCap, 0.92), X, Y + 30, 32, 2, k); continue; }
    if (c === "W") {
      R(T.wallFace, X, Y, 32, 32, k); R(T.wallFace2, X, Y + 22, 32, 7, k); R(T.wallBase, X, Y + 29, 32, 3, k);
      R(T.stripe, X, Y + 19, 32, 2, k);
      if (hash(x, y, 60) < 0.4) R(T.stain, X + 4 + hash(x, y, 61) * 18, Y + 2 + hash(x, y, 62) * 10, 7, 9, k);
      continue;
    }
    const [a, l] = floorColors(c, x, y);
    R(a, X, Y, 32, 32, k);
    if (c === "b" || c === "k") for (let i = 0; i < 4; i++) R("rgba(120,80,30,.12)", X, Y + i * 8, 32, 1, k);
    else if (c === "r") { for (let i = 0; i < 4; i++) R(T.grass2, X + hash(x, y, i) * 28, Y + 6 + hash(x, y, i + 4) * 22, 2, 3, k); R(T.curb, X, Y, 32, 3, k); }
    else if (l) {
      R(l, X, Y, 32, 1, k); R(l, X, Y, 1, 32, k);
      if (c === "," || c === "u" || c === "s") { R(l, X, Y + 16, 32, 1, k); R(l, X + 16, Y, 1, 32, k); }
    }
    if (c === ".") for (let i = 0; i < 5; i++) R(T.speck, X + 2 + hash(x, y, i) * 28, Y + 2 + hash(x, y, i + 9) * 28, 1, 1, k);
    if (c === "." || c === ",") grimeTD(k, X, Y, x, y);
  }
  for (let y = 1; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (isWall(MAP[y][x])) continue;
    if (isWall(at(x, y - 1))) R("rgba(60,50,30,.12)", x * 32, y * 32, 32, 4, k);
    if (at(x - 1, y) === "#") R("rgba(60,50,30,.08)", x * 32, y * 32, 3, 32, k);
  }
  R(T.platformEdge, 6 * 32 + 1, 2 * 32 + 26, 62, 38, k);
  R(T.platform, 6 * 32 + 3, 2 * 32 + 28, 58, 34, k);
  for (let i = 0; i < 4; i++) R("rgba(120,80,30,.15)", 6 * 32 + 3, 2 * 32 + 30 + i * 8, 58, 1, k);
  R(T.metal, 3 * 32 + 2, 32 + 2, 92, 22, k);
  R(T.glass, 3 * 32 + 4, 32 + 4, 88, 18, k);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 16; j++) R(T.glassHi, 3 * 32 + 14 + i * 28 + (16 - j) / 2, 32 + 5 + j, 2, 1, k);
  for (let s = 0; s < 2; s++) {
    R(T.metal, 10 * 32 + 4, 32 + 12 + s * 10, 120, 2, k);
    for (let i = 0; i < 11; i++) R(["#ff7a59", "#2bb5a4", "#e9a91c", "#7c9cff", "#ff8cc6"][(i + s * 2) % 5], 10 * 32 + 6 + i * 11, 32 + 5 + s * 10, 7, 7, k);
  }
  R(T.glass, 10 * 32 + 3, 7 * 32 + 4, 122, 18, k);
  for (let i = 0; i < 8; i++) R(i % 2 ? "#d9a877" : "#cf9c6a", 10 * 32 + i * 16, 13 * 32, 16, 29, k);
  R(T.mat, 6 * 32 + 3, 18 * 32 + 5, 58, 22, k);
  R(T.signBg, 1 * 32 + 6, 18 * 32 + 6, 80, 20, k);
  pixText(k, "GYM", 1 * 32 + 20, 18 * 32 + 8, 3, T.sign);
  R(T.signBg, 9 * 32 + 6, 18 * 32 + 8, 112, 16, k);
  pixText(k, "OPEN 24/7", 9 * 32 + 10, 18 * 32 + 11, 2, T.stripe2);
  for (const key in REGIONS) {
    const r = REGIONS[key];
    const fy = at(r.x0, r.y0 - 1) === "W" ? r.y0 - 1 : r.y0;
    const X = r.x0 * 32, Y = fy * 32, w = (r.x1 - r.x0 + 1) * 32, h = (r.y1 - fy + 1) * 32;

function buildStaticISO() {
  const k = statISO.getContext("2d");
  k.clearRect(0, 0, ISO.w, ISO.h);

  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {

    const [a, l] = floorColors(c, x, y);
    diamond(k, x, y, a, l);
    const [cx, cy] = isoP(x + 0.5, y + 0.5);
    if (c === "r") for (let i = 0; i < 3; i++) R(T.grass2, cx - 8 + hash(x, y, i) * 16, cy - 3 + hash(x, y, i + 4) * 6, 2, 2, k);
    if ((c === "." || c === ",") && hash(x, y, 40) < 0.22) { R(T.stain, cx - 5 + hash(x, y, 41) * 6, cy - 2, 8, 3, k); R(T.stain, cx - 3 + hash(x, y, 41) * 6, cy - 3, 4, 5, k); }
    if ((c === "." || c === ",") && hash(x, y, 43) < 0.16) { let px = cx - 6 + hash(x, y, 44) * 8; for (let i = 0; i < 6; i++) { R(T.crack, px, cy - 3 + i, 1, 1, k); px += hash(x, y, 50 + i) < 0.5 ? -1 : 1; } }

  for (let i = 1; i < 4; i++) { const a = isoP(6.05, 2.05 + i * 0.475), b = isoP(7.95, 2.05 + i * 0.475); line(k, a[0], a[1] - 1, b[0], b[1] - 1, shade(T.platform, 0.85)); }
  box(k, 6.1, 18.1, 1.8, 0.8, 0, 0, T.mat);
  // Gesperrte Bereiche
  for (const key in REGIONS) {
    const r = REGIONS[key];
    for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) {
      diamond(k, x, y, T.lockShade);

  }
  // Wände: hinten (Nord- und Westrand) hoch, alles andere abgeschnitten wie bei Theme Hospital
  const walls = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!isWall(MAP[y][x])) continue;
    const open = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const n = at(x + dx, y + dy); return !isWall(n); });
    if (!open) continue;
    const tall = (y <= 1 || x === 0) && y < 18;
    walls.push({ x, y, tall });
  }
  walls.sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const w of walls) {
    const h = w.tall ? 34 : 7;
    box(k, w.x, w.y, 1, 1, h, 0, T.wallSide, T.wallCapTop);
    // Raumseiten in Wandfarbe mit Streifen
    if (w.tall && !isWall(at(w.x, w.y + 1))) {
      wallRectY(k, w.y + 1, w.x, w.x + 1, 0, h, T.wallFace);
      wallRectY(k, w.y + 1, w.x, w.x + 1, 0, 3, T.wallBase);
      wallRectY(k, w.y + 1, w.x, w.x + 1, 11, 13, T.stripe);
      if (hash(w.x, w.y, 60) < 0.4) wallRectY(k, w.y + 1, w.x + 0.2 + hash(w.x, w.y, 61) * 0.4, w.x + 0.45 + hash(w.x, w.y, 61) * 0.4, 18, 26, T.stain);
    }
    if (w.tall && !isWall(at(w.x + 1, w.y))) {
      wallRectX(k, w.x + 1, w.y, w.y + 1, 0, h, T.wallFace2);
      wallRectX(k, w.x + 1, w.y, w.y + 1, 0, 3, T.wallBase);
      wallRectX(k, w.x + 1, w.y, w.y + 1, 11, 13, T.stripe);
    }
    if (!w.tall) {
      const [cx, cy] = isoP(w.x + 0.5, w.y + 0.5);
      R(T.stripe, cx - 1, cy - 8, 2, 1, k);
    }
  }
  // Spiegel an der Hallenwand, Regal in der Protein Bar, Spiegel im Kursraum
  wallRectY(k, 2, 3.1, 5.9, 15, 31, T.metal);
  wallRectY(k, 2, 3.18, 5.82, 16, 30, T.glass);
  for (let i = 0; i < 3; i++) { const a = isoP(3.5 + i * 0.8, 2), b = isoP(3.75 + i * 0.8, 2); line(k, a[0], a[1] - 17, b[0], b[1] - 29, T.glassHi); }
  for (let s = 0; s < 2; s++) {

    for (let i = 0; i < 11; i++) wallRectY(k, 2, 10.2 + i * 0.33, 10.4 + i * 0.33, 17 + s * 8, 22 + s * 8, ["#ff7a59", "#2bb5a4", "#e9a91c", "#7c9cff", "#ff8cc6"][(i + s * 2) % 5]);
  }
  for (const key in REGIONS) {
    const r = REGIONS[key];
    const [cx, cy] = isoP((r.x0 + r.x1 + 1) / 2, (r.y0 + r.y1 + 1) / 2);
    lockIcon(k, cx, cy - 4);
  }
  // Absperrungen
  for (const [x, y] of OPENINGS) {
    const horiz = isWall(at(x, y - 1));
    if (horiz) { box(k, x + 0.45, y + 0.05, 0.1, 0.1, 10, 0, T.metal); box(k, x + 0.45, y + 0.85, 0.1, 0.1, 10, 0, T.metal); const a = isoP(x + 0.5, y + 0.1), b = isoP(x + 0.5, y + 0.9); line(k, a[0], a[1] - 8, b[0], b[1] - 8, "#e5484d"); }

  }
}

function findPath(sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  const prev = new Map(); const q = [[sx, sy]]; prev.set(key(sx, sy), null);
  while (q.length) {

      prev.set(nk, [x, y]); q.push([nx, ny]);
    }
  }
  if (!prev.has(key(tx, ty))) return null;
  const path = []; let c = [tx, ty];
  while (c && !(c[0] === sx && c[1] === sy)) { path.unshift(c); c = prev.get(key(...c)); }
  return path;
}

}

  }

  for (const s of smoke) { const [ax, ay] = eqAnchor(s.e); R(`rgba(150,155,165,${Math.min(0.8, s.t)})`, ax + s.ox, ay + 26 - s.h, 4, 4); }
  for (const e of EQ) {

// ---------- Bildschirm ----------
const view = document.getElementById("view");
const ctx = view.getContext("2d");

    const r = REGIONS[k];

  }

    ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.strokeText(p.text, sx, sy);

    ctx.globalAlpha = 1;
  }

    const [sx, sy0] = toScreen(wx, wy - 34);

// ---------- HUD ----------
const $ = (id) => document.getElementById(id);
const last = {};
function hud() {
  const money = Math.floor(state.money).toLocaleString("de-DE");
  if (last.money !== money) { $("money").textContent = money; last.money = money; }
  const r = Math.round(state.ruf * 10) / 10;
  if (last.ruf !== r) {
    const full = Math.round(state.ruf);
    $("stars").textContent = "★".repeat(full) + "☆".repeat(5 - full);
    $("ruf").textContent = r.toLocaleString("de-DE", { minimumFractionDigits: 1 });
    last.ruf = r;
  }
  if (last.lvl !== state.lvl) { $("lvl").textContent = state.lvl; last.lvl = state.lvl; }
  const lo = LVL[state.lvl - 1], hi = LVL[state.lvl] || lo + 1;
  $("xpbar").style.width = Math.min(100, ((state.xp - lo) / (hi - lo)) * 100) + "%";
  const hh = Math.floor(state.min / 60), mm = Math.floor(state.min % 60);
  const clock = String(hh).padStart(2, "0") + ":" + String(Math.floor(mm / 10) * 10).padStart(2, "0") + " · 24/7";

let toastT = 0;
function toast(text) { const el = $("toast"); el.textContent = text; el.hidden = false; toastT = 2.6; }

// ---------- Eingabe ----------
const pointers = new Map();
let gesture = null;
view.addEventListener("pointerdown", (e) => {
  view.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) gesture = { type: "pan", sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, t: performance.now(), moved: false };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    gesture = { type: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y };
  }
});
view.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture) return;
  const rect = view.getBoundingClientRect();
  if (gesture.type === "pan" && pointers.size === 1) {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (Math.hypot(dx, dy) > 6) gesture.moved = true;
    cam.x = gesture.cx + dx; cam.y = gesture.cy + dy; clampCam();
  } else if (gesture.type === "pinch" && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const ns = Math.max(minScale(), Math.min(4, gesture.s * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d));
    const wx = (gesture.mx - rect.left - gesture.cx) / gesture.s, wy = (gesture.my - rect.top - gesture.cy) / gesture.s;
    cam.s = ns; cam.x = (a.x + b.x) / 2 - rect.left - wx * ns; cam.y = (a.y + b.y) / 2 - rect.top - wy * ns; clampCam();
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture && gesture.type === "pan" && !gesture.moved && performance.now() - gesture.t < 400 && pointers.size === 0) {
    const rect = view.getBoundingClientRect();
    tap(...toWorld(e.clientX - rect.left, e.clientY - rect.top));
  }
  if (pointers.size === 0) gesture = null;
  else if (pointers.size === 1) { const [p] = [...pointers.values()]; gesture = { type: "pan", sx: p.x, sy: p.y, cx: cam.x, cy: cam.y, t: 0, moved: true }; }
}
view.addEventListener("pointerup", endPointer);
view.addEventListener("pointercancel", endPointer);
view.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = view.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [wx, wy] = toWorld(mx, my);
  cam.s = Math.max(minScale(), Math.min(4, cam.s * Math.exp(-e.deltaY * 0.0015)));
  cam.x = mx - wx * cam.s; cam.y = my - wy * cam.s; clampCam();
}, { passive: false });

// wx, wy: Pixel in der Weltleinwand der aktiven Ansicht
function tap(wx, wy) {

  else { const u = (wx - ISO.ox) / 16, v = (wy - ISO.oy) / 8; fx = (u + v) / 2; fy = (v - u) / 2; }
  const tx = Math.floor(fx), ty = Math.floor(fy);
  const li = litter.findIndex((l) => {
    const [sx, sy] = mode === "td" ? [l.tx * 32 + l.ox + 6, l.ty * 32 + l.oy + 3] : isoP(l.tx + l.ox / 32, l.ty + (l.oy - 8) / 32);
    return Math.abs(sx - wx) < 12 && Math.abs(sy - wy) < 10;
  });
  if (li >= 0) { const l = litter.splice(li, 1)[0]; popup(l.tx * 32 + 16, l.ty * 32 + 24, "Aufgeräumt", "ok"); state.ruf = Math.min(5, state.ruf + 0.03); return; }

  if (near === josef) { toast("Josef, 18. Sein Vater trainiert hier seit Jahren. Zuverlässig wie ein Uhrwerk."); return; }

  const e = EQ.find(hit);
  if (e) {
    if (e.kind === "water") { toast("Wasserspender: kostenlos, macht Kunden glücklich."); return; }
    if ((e.broken || e.wear < 30) && !e.queued) {
      if (e.user) toast(e.name + " ist gerade belegt. Josef repariert danach.");
      e.queued = true; jobs.push(e); say(josef, "Bin unterwegs!", 1.6); return;
    }
    toast(e.name + ": Zustand " + Math.round(e.wear) + " %" + (e.queued ? ", Josef ist dran" : ""));
    return;
  }
  for (const k in REGIONS) {
    const r = REGIONS[k];
    if (tx >= r.x0 && tx <= r.x1 && ty >= r.y0 - 1 && ty <= r.y1) { toast(r.name + ": ab Level " + r.lvl + " freischaltbar."); return; }
  }
}

// ---------- Steuerung ----------
function applyMode(m) {
  mode = m;
  $("mode-td").setAttribute("aria-pressed", String(m === "td"));
  $("mode-iso").setAttribute("aria-pressed", String(m === "iso"));
  try { localStorage.setItem("gt-view", m); } catch (e) {}
  centerCam();
}
$("mode-td").addEventListener("click", () => applyMode("td"));
$("mode-iso").addEventListener("click", () => applyMode("iso"));
$("speed").addEventListener("click", () => { state.speed = state.speed === 1 ? 3 : 1; $("speed").textContent = "Tempo " + state.speed + "×"; });
$("center").addEventListener("click", centerCam);

const LINES = [
  "Hey, ich bin Josef! Dein Onkel hat dir die alte Muckibude vermacht. Ja, die sieht genau so aus, wie sie riecht.",
  "Hier hat früher sogar eine echte Bodybuilding-Legende trainiert. Mein Vater auch, seit ich denken kann. Ich kenne jede Hantel beim Vornamen.",
  "Die Geräte sind uralt, ein Laufband ist schon tot. Tipp auf kaputte oder wackelige Geräte, dann repariere ich sie. Liegt was rum, tipp drauf.",
  "Die Leute meckern noch viel. Wenn wir aufräumen und reparieren, steigt der Ruf, und die grauen Bereiche schalten wir nach und nach frei.",
];
let lineIdx = 0;
function drawFace() {
  const c = $("josef-face"), k = c.getContext("2d");
  k.clearRect(0, 0, c.width, c.height);
  const keep = g; g = k;
  try { drawPerson({ ...josef, x: 10, y: 30, dir: "down", moving: false, pose: "stand", bub: null }, 0); } finally { g = keep; }
}
function showLine() {
  $("dialog-text").textContent = LINES[lineIdx];
  $("dialog-dots").textContent = (lineIdx + 1) + " / " + LINES.length;
  $("dialog-next").textContent = lineIdx === LINES.length - 1 ? "Los geht's" : "Weiter";
}
$("dialog-next").addEventListener("click", () => {
  lineIdx++;
  if (lineIdx >= LINES.length) { $("dialog").hidden = true; try { localStorage.setItem("gt-intro-hell", "1"); } catch (e) {} return; }
  showLine();
});

// ---------- Start ----------
let seen = false;
try { seen = localStorage.getItem("gt-intro-hell") === "1"; } catch (e) {}
if (!seen) { $("dialog").hidden = false; showLine(); }
litter.push(
  { tx: 3, ty: 4, kind: "db", ox: 8, oy: 14 }, { tx: 4, ty: 9, kind: "towel", ox: 10, oy: 16 },
  { tx: 2, ty: 7, kind: "bottle", ox: 12, oy: 12 }, { tx: 6, ty: 13, kind: "towel", ox: 9, oy: 15 },
  { tx: 3, ty: 11, kind: "db", ox: 14, oy: 10 }, { tx: 6, ty: 16, kind: "bottle", ox: 7, oy: 18 },
);
const startTiles = [[3, 6], [4, 8], [2, 4], [6, 5], [7, 10]];
for (let i = 0; i < 5; i++) {
  spawn();
  const p = people[people.length - 1];
  p.x = startTiles[i][0] * 32 + 16; p.y = startTiles[i][1] * 32 + 24; p.path = []; p.state = "checkin"; p.timer = 0.01 + i * 0.3;
  if (p.type === "wellness") p.type = "anfaenger";
}
buildStaticTD(); buildStaticISO(); drawFace();
resize(); applyMode(mode);
window.addEventListener("resize", resize);

let prevT = performance.now(), simT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now;
  const sdt = dt * state.speed; simT += sdt;
  step(sdt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $("toast").hidden = true; }
  if (reviewT > 0) { reviewT -= dt; if (reviewT <= 0) $("review").hidden = true; }
  drawWorld(simT); render(); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
