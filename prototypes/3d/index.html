<title>Gym Tycoon 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: Vollbild-3D-Szene. Oben eine ruhige Statusleiste, darunter der Aufräumen-Hinweis, unten runde Icon-Buttons, Josef als Karte. */
:root {
  --bg: #e6ebef;
  --panel: rgba(255, 255, 255, 0.97);
  --line: rgba(30, 41, 59, 0.08);
  --fg: #1e293b;
  --muted: #64748b;
  --accent: #4a9fe8;
  --accent-ink: #ffffff;
  --accent-soft: #e6f2fc;
  --level: #19b5a5;
  --money: #15965a;
  --gold: #f5b014;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 20px rgba(15, 23, 42, 0.08);
  --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font-family: var(--font-ui); }
#app { position: fixed; inset: 0; }
#gl, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; cursor: grab; }
#overlay { pointer-events: none; }

.hud-tl, .hud-tr {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; flex-direction: column; gap: 6px; pointer-events: none;
}
.hud-tl { left: max(12px, env(safe-area-inset-left, 0px)); align-items: flex-start; }
.hud-tr { right: max(12px, env(safe-area-inset-right, 0px)); align-items: flex-end; }
.stat {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 5px;
  border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stat .ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.stat .ico svg { width: 16px; height: 16px; }
.ico.money { background: #e3f6ea; color: var(--money); }
.ico.time { background: var(--accent-soft); color: var(--accent); }
.ico.star { background: #fff4d6; color: var(--gold); }
.ico.lvl { background: color-mix(in srgb, var(--level) 16%, white); color: var(--level); }
.stat .sub { font-size: 12px; font-weight: 700; color: var(--muted); }
.stat .bar { width: 56px; height: 6px; border-radius: 3px; background: rgba(30, 41, 59, 0.08); overflow: hidden; }
.stat .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--level); }
.money-v { color: var(--money); }
.side {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 104px);
  display: flex; flex-direction: column; gap: 10px;
}
.pill {
  position: relative; pointer-events: auto;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 8px 8px 12px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--panel); color: var(--fg); box-shadow: var(--shadow);
  font: 700 14px var(--font-ui);
}
.pill svg { width: 18px; height: 18px; color: var(--accent); }
.pill .count { min-width: 22px; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12.5px; font-weight: 800; text-align: center; }
.pill:focus-visible, .fab:focus-visible, .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.dock {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; gap: 10px; align-items: center;
}
.fab.big { width: 62px; height: 62px; background: var(--accent); color: var(--accent-ink); border: 0; box-shadow: 0 6px 16px rgba(74, 159, 232, 0.4); }
.fab.big svg { width: 28px; height: 28px; }
.fab .dot { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; background: #e5484d; color: #fff; font: 800 11px var(--font-ui); display: grid; place-items: center; }
.fab {
  position: relative; width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.fab svg { width: 22px; height: 22px; }
.fab .badge { position: absolute; top: -4px; right: -4px; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 800 11px var(--font-ui); }
.palette-name {
  position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); left: max(14px, env(safe-area-inset-left, 0px));
  padding: 6px 12px; border-radius: 999px; background: var(--panel); box-shadow: var(--shadow);
  font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.palette-name b { color: var(--fg); }

.dialog {
  position: absolute;
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
  max-width: 520px; margin: 0 auto;
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start;
  padding: 14px; border-radius: 18px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 22px; font-weight: 800; }
.dialog .who { font-size: 15px; font-weight: 800; }
.dialog .who small { color: var(--muted); font-weight: 600; font-size: 12.5px; margin-left: 6px; }
.dialog p { margin: 4px 0 12px; font-size: 15px; line-height: 1.5; font-weight: 500; min-width: 0; }
.dialog .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dialog .dots { color: var(--muted); font-size: 12.5px; font-weight: 700; }
.primary { border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font: 800 14px var(--font-ui); box-shadow: 0 4px 12px rgba(74, 159, 232, 0.35); }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; height: 56%;
  display: flex; flex-direction: column;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  background: #f4f6f9; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(15, 23, 42, 0.18);
  overflow-y: auto; overscroll-behavior: contain;
}
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: #cbd2da; margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--fg); }
.icon-btn svg { width: 18px; height: 18px; }
.tabs { margin-left: auto; display: inline-flex; padding: 3px; border-radius: 12px; background: #e6eaef; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font: 700 13.5px var(--font-ui); color: var(--muted); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: #fff; color: var(--fg); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); }
.sheet h2 { margin: 12px 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.kpi { padding: 8px 10px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
.kpi .label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.kpi b { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.card { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); }
.card .thumb { width: 64px; height: 64px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; position: relative; }
.card .thumb svg { width: 38px; height: 38px; }
.lvl-badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); padding: 1px 8px; border-radius: 999px; background: var(--level); color: #fff; font-size: 11px; font-weight: 800; white-space: nowrap; }
.card h3 { margin: 0; font-size: 16px; font-weight: 800; }
.card p { margin: 2px 0 8px; font-size: 13px; line-height: 1.4; color: var(--muted); font-weight: 600; min-width: 0; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cost { font-size: 14px; font-weight: 800; color: var(--money); }
.primary:disabled { background: #cbd2da; box-shadow: none; cursor: not-allowed; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.tile { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: #8a97a6; display: grid; place-items: center; cursor: pointer; }
.tile svg { width: 30px; height: 30px; }
.tile[aria-pressed="true"] { border: 2px solid var(--accent); color: var(--accent); background: var(--accent-soft); }
.tile .n { position: absolute; top: 4px; right: 5px; font-size: 11px; font-weight: 800; color: var(--level); }
.tile.locked { background: #eef1f4; color: #b3bdc8; cursor: default; }
.tile.locked .n { color: #9aa5b1; }
.staff { display: flex; flex-direction: column; gap: 8px; }
.person { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
.person .face { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff; }
.person b { display: block; font-size: 14.5px; }
.person span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.person.locked { opacity: 0.6; }
.person .primary { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.person .face svg { width: 24px; height: 24px; }
.ghost-btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font: 700 13px var(--font-ui); color: var(--muted); }
.toast {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: 33%;
  max-width: min(420px, calc(100% - 32px));
  padding: 10px 14px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 14px; font-weight: 600; line-height: 1.4; text-align: center; pointer-events: none;
}
.toast .rev-stars { color: var(--gold); margin-right: 6px; }
.toast .rev-who { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
#review { top: calc(33% + 54px); }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; }
</style>

<div id="app">
  <canvas id="gl" aria-label="Gym-Ansicht: ziehen zum Verschieben, zwei Finger zum Zoomen, tippen zum Interagieren"></canvas>
  <canvas id="overlay"></canvas>

  <div class="hud-tl" aria-live="polite">
    <div class="stat"><span class="ico money">€</span><span class="money-v" id="money">300</span></div>
    <div class="stat" id="ad-chip" hidden><span class="ico lvl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></span><span id="ad-text">Werbung</span></div>
    <div class="stat"><span class="ico time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><span id="clock">16:00</span><span class="sub">24/7</span></div>
    <button class="pill" id="clean" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6"/><path d="M17 7l-7.5 7.5"/><path d="M9.5 14.5L4 20h7l2-2"/><path d="M9.5 14.5l2.5 2.5"/></svg>
    Aufräumen <span class="count" id="litter-count">0</span>
  </button>
  </div>
  <div class="hud-tr">
    <div class="stat"><span class="ico star">★</span><span id="ruf">2,1</span><span class="sub" id="stars">von 5</span></div>
    <div class="stat"><span class="ico lvl" id="lvl">1</span><span class="bar"><i id="xpbar"></i></span></div>
  </div>



  <div class="side">
    <button class="fab" id="btn-staff" type="button" aria-label="Mitarbeiter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
    </button>
    <button class="fab" id="btn-stats" type="button" aria-label="Statistik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 19v-6M12 19V6M18 19v-9"/></svg>
    </button>
    <button class="fab" id="btn-alerts" type="button" aria-label="Meldungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 17h12l-1.5-2V11a4.5 4.5 0 0 0-9 0v4z"/><path d="M10 20h4"/></svg>
      <span class="dot" id="alert-dot" hidden>1</span>
    </button>
  </div>

  <div class="palette-name" id="palette-name">Palette <b>Hellgrau</b></div>
  <div class="dock">
    <button class="fab" id="palette" type="button" aria-label="Farbpalette wechseln">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.3" fill="currentColor"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor"/><circle cx="16" cy="10" r="1.3" fill="currentColor"/><path d="M12 21a3 3 0 0 1 0-6h2"/></svg>
    </button>
    <button class="fab" id="speed" type="button" aria-label="Tempo umschalten">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6.5v11l7-5.5zM12 6.5v11l7-5.5z"/></svg>
      <span class="badge" id="speed-badge">1×</span>
    </button>
    <button class="fab" id="center" type="button" aria-label="Kamera zentrieren">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="fab big" id="btn-build" type="button" aria-label="Bauen und Verwalten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l8.5-8.5"/><path d="M11 6.5l3-3 6.5 6.5-3 3z"/><path d="M14 9.5l-2 2"/></svg>
    </button>
  </div>

  <section class="sheet" id="sheet" hidden aria-label="Kraftraum">
    <div class="grip"></div>
    <div class="sheet-head">
      <button class="icon-btn" id="sheet-close" type="button" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="tabs"><button type="button" id="tab-btn-eq" aria-pressed="true">Geräte</button><button type="button" id="tab-btn-team" aria-pressed="false">Mitarbeiter</button></div>
    </div>
    <h2>Kraftraum</h2>
    <div class="kpis">
      <div class="kpi"><span class="label">Einnahmen/Std</span><b id="kpi-income">0 €</b></div>
      <div class="kpi"><span class="label">Gäste jetzt</span><b id="kpi-guests">0</b></div>
      <div class="kpi"><span class="label">Zustand Ø</span><b id="kpi-cond">0 %</b></div>
    </div>
    <div id="tab-eq">
      <article class="card">
        <div class="thumb" id="card-icon"></div>
        <div>
          <h3 id="card-title"></h3>
          <p id="card-desc"></p>
          <div class="row"><span class="cost" id="card-cost"></span><button class="primary" id="card-upgrade" type="button">Verbessern</button></div>
        </div>
      </article>
      <div class="grid" id="eq-grid"></div>
    </div>
    <div id="tab-team" class="staff" hidden></div>
  </section>

  <div class="dialog" id="dialog" hidden>
    <div class="avatar" aria-hidden="true">J</div>
    <div>
      <div class="who">Josef <small>18, dein erster Mitarbeiter</small></div>
      <p id="dialog-text"></p>
      <div class="row"><span class="dots" id="dialog-dots"></span><button class="primary" id="dialog-next" type="button">Weiter</button></div>
    </div>
  </div>

  <section class="sheet" id="mgmt" hidden aria-label="Bauen und Verwalten">
    <div class="grip"></div>
    <div class="sheet-head">
      <button class="icon-btn" id="mgmt-close" type="button" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="tabs"><button type="button" data-mtab="rooms" aria-pressed="true">Räume</button><button type="button" data-mtab="team" aria-pressed="false">Mitarbeiter</button><button type="button" data-mtab="ads" aria-pressed="false">Werbung</button></div>
    </div>
    <h2 id="mgmt-title">Räume</h2>
    <div class="staff" id="mgmt-body"></div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <div class="toast" id="review" hidden></div>
  <div class="fail" id="fail" hidden>3D konnte nicht geladen werden. Bitte die Seite neu laden.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
if (!window.THREE) { document.getElementById("fail").hidden = false; return; }
const $ = (id) => document.getElementById(id);

// ---------- Karte ----------
// Spalten: Wand | 8 (Ausbau West / Wellness / Umkleide) | Wand | 8 (Gym, Lobby) | Wand | 6 (Bar, Kurs, Personal) | Wand
// Zeilen:  Wand | 10 (Wellness, Ausbau Nord, Kurs) | Wand | 10 (Gym-Zeile) | Wand | 5 (Lobby-Zeile) | Wand | Gehweg | Wiese
const COLS = 26, ROWS = 31;
const G = Array.from({ length: ROWS }, () => Array(COLS).fill("#"));
function fill(x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) G[y][x] = c; }
fill(1, 1, 8, 10, "x"); fill(10, 1, 17, 10, "n"); fill(19, 1, 24, 10, "k");
fill(1, 12, 8, 21, "w"); fill(10, 12, 17, 21, "."); fill(19, 12, 24, 21, "b");
fill(1, 23, 8, 27, "u"); fill(10, 23, 17, 27, ","); fill(19, 23, 24, 27, "f");
fill(13, 22, 14, 22, "."); fill(13, 28, 14, 28, ",");
fill(0, 29, COLS - 1, 29, "o"); fill(0, 30, COLS - 1, 30, "r");
const OPENINGS = [[9, 5], [18, 5], [4, 11], [14, 11], [21, 11], [9, 16], [18, 16], [9, 25], [18, 25]];
for (const [x, y] of OPENINGS) G[y][x] = "-";
const MAP = G.map((r) => r.join(""));
const at = (x, y) => (x < 0 || y < 0 || x >= COLS || y >= ROWS) ? " " : MAP[y][x];
const isWall = (c) => c === "#";
const isActive = (c) => c === "." || c === ",";

const REGIONS = {
  u: { name: "Umkleide", lvl: 2 },
  b: { name: "Protein Bar", lvl: 3 },
  w: { name: "Ausbau West", lvl: 4 },
  k: { name: "Kursraum", lvl: 5 },
  n: { name: "Ausbau Nord", lvl: 6 },
  f: { name: "Personalraum", lvl: 7 },
  x: { name: "Wellness", lvl: 8 },
};
for (const k in REGIONS) Object.assign(REGIONS[k], { x0: 99, y0: 99, x1: -1, y1: -1 });
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  const r = REGIONS[MAP[y][x]];
  if (r) { r.x0 = Math.min(r.x0, x); r.y0 = Math.min(r.y0, y); r.x1 = Math.max(r.x1, x); r.y1 = Math.max(r.y1, y); }
}

// ---------- Farben ----------
// Feste Farben für Geräte und Stadt; Räume, Wände und Akzente kommen aus der gewählten Palette.
const C = {
  walk: ["#e3e5e8", "#dcdfe3"], grass: ["#86c862", "#7dbd5a"],
  metal: "#3f4854", chrome: "#e3e8ee", chromeDk: "#9fa9b4",
  plate: "#2f3640", bumper: "#19b5a5", belt: "#2a3038", screen: "#7ee0ff",
  deskTop: "#ffffff", platform: "#cfd5db", pot: "#ffffff", mat: "#3f4854",
  leaf: "#4fb65e", leaf2: "#3d9e4e", trunk: "#8a6a4a",
  pavement: "#9ccf7a", road: "#5b616b", roadLine: "#f4f6f8", sidewalk: "#e6e8eb",
};
const PALETTES = [
  { name: "Hellgrau", ui: { "--accent": "#4a9fe8", "--accent-soft": "#e6f2fc", "--level": "#19b5a5", "--bg": "#e6ebef" },

function faceBuilder() {
  const P = [], N = [], Co = [], col = new THREE.Color();
  function face(v, n, c) {
    col.set(c);
    for (const i of [0, 1, 2, 0, 2, 3]) { P.push(...v[i]); N.push(...n); Co.push(col.r, col.g, col.b); }
  }
  function boxFaces(x0, y0, z0, x1, y1, z1, colorFor) {
    const f = [
      ["top", [[x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0]], [0, 1, 0]],
      ["+x", [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], [1, 0, 0]],
      ["-x", [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], [-1, 0, 0]],
      ["+z", [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], [0, 0, 1]],
      ["-z", [[x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [x1, y0, z0]], [0, 0, -1]],
    ];
    for (const [k, v, n] of f) { const c = colorFor(k); if (c) face(v, n, c); }
  }

    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(N, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(Co, 3));
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
    m.receiveShadow = true;
    return m;
  }
  return { face, boxFaces, build };
}
function floorColor(c, x, y) {
  const a = (x + y) & 1;
  if (c === ".") return C.hall[a];
  if (c === ",") return C.lobby[a];
  if (c === "o") return C.walk[a];
  if (c === "r") return C.grass[a];
  if (c === "#" || c === "-") return C.corridor;
  return C.lot[a];
}

function windowTexture(base, win) {

  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function building(x0, z0, x1, z1, h, base) {
  const w = x1 - x0, d = z1 - z0;

  const sx = side(Math.round(d / 1.4), Math.round(h / 1.2)), sz = side(Math.round(w / 1.4), Math.round(h / 1.2));
  const roof = mat(new THREE.Color(base).offsetHSL(0, -0.05, 0.08).getStyle());
  const m = mesh(new THREE.BoxGeometry(w, h, d), [sx, sx, roof, roof, sz, sz], x0 + w / 2, h / 2, z0 + d / 2, scene);
  B(scene, x0 + 0.2, z0 + 0.2, w - 0.4, d - 0.4, 6, h / HS, "#efe6da");
  for (let i = 0; i < Math.floor(w / 3); i++) B(scene, x0 + 1 + i * 3, z0 + 1, 0.8, 0.6, 10, h / HS + 6, "#d7d0c5");
  return m;
}

let gesture = null;
glCanvas.addEventListener("pointerdown", (e) => {
  glCanvas.setPointerCapture(e.pointerId); camGoal = null;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) gesture = { type: "pan", lx: e.clientX, ly: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; gesture = { type: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y), z: zoom }; }
});
glCanvas.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture) return;
  if (gesture.type === "pan" && pointers.size === 1) {
    if (Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 6) gesture.moved = true;
    panBy(e.clientX - gesture.lx, e.clientY - gesture.ly); gesture.lx = e.clientX; gesture.ly = e.clientY;
  } else if (gesture.type === "pinch" && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoom = Math.max(0.45, Math.min(3, gesture.z * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d)); updateCamera();
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture && gesture.type === "pan" && !gesture.moved && performance.now() - gesture.t < 400 && pointers.size === 0) {
    const rect = glCanvas.getBoundingClientRect();
    tap(e.clientX - rect.left, e.clientY - rect.top);
  }
  if (pointers.size === 0) gesture = null;
  else if (pointers.size === 1) { const [p] = [...pointers.values()]; gesture = { type: "pan", lx: p.x, ly: p.y, sx: p.x, sy: p.y, t: 0, moved: true }; }
}

function cleanUp(i) {
  const l = litter.splice(i, 1)[0];
  scene.remove(l.g); scene.remove(l.arrow);
  state.cleaned++; state.ruf = Math.min(5, state.ruf + 0.03);
  popup(l.tx + l.ox, 0.8, l.ty + l.oz, "Aufgeräumt", "ok");
  if (state.cleaned === 1) toast("Genau so! Alles mit Pfeil kannst du antippen und wegräumen.");
}
function tap(sx, sy) {
  // Müll: großzügig um Gegenstand und Pfeil
  let best = -1, bestD = 34;
  litter.forEach((l, i) => {
    const [ax, ay] = toScreen(l.tx + l.ox, 0.05, l.ty + l.oz), [bx, by] = toScreen(l.tx + l.ox, 0.6, l.ty + l.oz);
    const d = Math.min(Math.hypot(ax - sx, ay - sy), Math.hypot(bx - sx, by - sy));
    if (d < bestD) { bestD = d; best = i; }
  });
  if (best >= 0) return cleanUp(best);
  const near = [...people, josef].find((p) => {
    const [fx, fy] = toScreen(p.x / 32, 0, (p.y - 8) / 32), [hx, hy] = toScreen(p.x / 32, 0.95, (p.y - 8) / 32);
    return Math.abs(sx - fx) < 16 && sy < fy + 4 && sy > hy - 4;
  });
  if (near === josef) { toast("Josef, 18. Sein Vater trainiert hier seit Jahren. Zuverlässig wie ein Uhrwerk."); return; }
  if (near) {
    const ty2 = TYPES[near.type];
    toast(ty2.label + (near.type === "wellness" ? ": will in die Sauna" : ": will " + [...new Set(ty2.wants.map((k) => EQ.find((e) => e.kind === k).name))].join(", ")));
    return;
  }
  const gp = groundAt(sx, sy);
  if (!gp) return;
  // Geräte stehen hoch, deshalb auch den Punkt etwas weiter hinten prüfen
  const e = EQ.find((q) => {
    const cx = (q.x0 + q.x1 + 1) / 2, cz = (q.y0 + q.y1 + 1) / 2;
    for (const back of [0, 0.5, 1]) if (Math.abs(gp.x - back - cx) < (q.x1 - q.x0 + 1) / 2 + 0.2 && Math.abs(gp.z - back - cz) < (q.y1 - q.y0 + 1) / 2 + 0.2) return true;
    return false;
  });
  if (e) {
    if (e.kind === "water") { toast("Wasserspender: kostenlos, macht Kunden glücklich."); return; }
    if ((e.broken || e.wear < 30) && !e.queued) { e.queued = true; jobs.push(e); toast("Josef kümmert sich um " + (e.kind === "bench" ? "die " : "das ") + e.name + "."); return; }
    openSheet("eq", e);
    return;
  }
  const tx = Math.floor(gp.x), ty = Math.floor(gp.z);
  if (at(tx, ty) === ".") { openSheet("eq"); return; }
  for (const k in REGIONS) {
    const r = REGIONS[k];
    if (tx >= r.x0 && tx <= r.x1 && ty >= r.y0 && ty <= r.y1) { toast(r.name + ": ab Level " + r.lvl + " freischaltbar."); return; }
  }
}

for (let i = 0; i < 5; i++) {
  spawn();
  const p = people[people.length - 1];
  p.x = startTiles[i][0] * 32 + 16; p.y = startTiles[i][1] * 32 + 24; p.path = []; p.state = "checkin"; p.timer = 0.01 + i * 0.3;
  if (p.type === "wellness") p.type = "anfaenger";
}
resize(); centerCam();
window.addEventListener("resize", resize);

let prevT = performance.now(), simT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now;
  const sdt = dt * state.speed; simT += sdt;
  step(sdt);
  if (camGoal) { target.lerp(camGoal, Math.min(1, dt * 6)); updateCamera(); if (target.distanceTo(camGoal) < 0.02) camGoal = null; }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $("toast").hidden = true; }
  if (reviewT > 0) { reviewT -= dt; if (reviewT <= 0) $("review").hidden = true; }
  syncScene(simT, sdt);
  renderer.render(scene, camera);
  drawOverlay(); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
